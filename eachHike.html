<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>
    
    <!-- Main content goes here -->
    <main class="container py-4">
        <h1 id="hikeName">Loading...</h1>
        <img id="hikeImage" class="img-fluid rounded mt-3" src="" alt="Hike image">
        <p class="mt-2">
            <span class="badge rounded-pill text-bg-light border fw-normal">
                <i class="bi bi-eye-fill me-1"></i><span id="viewCount">0</span> views
            </span>
        </p>
    </main>
    <section class="container mt-4">
        <h2>Write a review</h2>
        <form id="reviewForm" novalidate>
            <div class="mb-3">
                <label for="reviewTitle" class="form-label">Title</label>
                <input type="text" id="reviewTitle" class="form-control" placeholder="e.g. Great views!" required />
            </div>
            <div class="mb-3">
                <label for="reviewRating" class="form-label">Rating</label>
                <select id="reviewRating" class="form-select">
                    <option value="5">5 – Loved it</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1 – Never again</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="reviewText" class="form-label">Review</label>
                <textarea id="reviewText" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-success">Submit review</button>
        </form>
    </section>
    
    <section class="container mt-4 card shadow-sm bg-light">
        <h2>Latest reviews</h2>
        <div id="reviews-go-here"></div>
    </section>
    
    <template id="reviewTemplate">
        <div class="card mb-2">
            <div class="card-body">
                <h5 class="card-title review-title"></h5>
                <h6 class="card-subtitle mb-2 text-muted review-meta"></h6>
                <p class="card-text review-text"></p>
            </div>
        </div>
    </template>
    <!-- our own footer goes here -->
    <site-footer></site-footer>
    
    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/eachHike.js"></script>

</body>

</html>
